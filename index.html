<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brum-Brum | Toko Motor SPA</title>
    <style>
        :root {
            --primary: #d32f2f;
            --dark: #1a1a1a;
            --light: #f4f4f4;
            --success: #388e3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background-color: var(--dark);
            color: white;
            padding: 1.5rem;
            text-align: center;
            border-bottom: 5px solid var(--primary);
        }
        header h1 { margin: 0; font-size: 2.5rem; letter-spacing: 2px; }
        header p { margin: 5px 0 0; color: #bbb; }
        
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Form Styling */
        .form-container {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .form-container h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--light); padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-submit { background-color: var(--primary); color: white; }
        .btn-submit:hover { background-color: #b71c1c; }
        .btn-cancel { background-color: #757575; color: white; margin-top: 0.5rem; display: none; }

        .products-container {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .products-container h3 { margin-top: 0; color: var(--dark); }
        
        #alert-box {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: none;
            font-weight: bold;
        }
        .alert-error { background-color: #ffcdd2; color: #b71c1c; border-left: 5px solid #b71c1c; }
        .alert-success { background-color: #c8e6c9; color: #256029; border-left: 5px solid #388e3c; }

        .product-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fff;
            transition: 0.2s;
        }
        .product-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product-info h4 { margin: 0 0 0.5rem 0; color: var(--dark); font-size: 1.2rem; }
        .product-info p { margin: 0; color: var(--primary); font-weight: bold; }
        
        .action-btns { display: flex; gap: 0.5rem; }
        .btn-action {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-edit { background-color: #ffb300; color: #fff; }
        .btn-edit:hover { background-color: #ff8f00; }
        .btn-delete { background-color: #e53935; color: #fff; }
        .btn-delete:hover { background-color: #d32f2f; }
        
        /* Loading text */
        .loading { text-align: center; font-style: italic; color: #777; }
    </style>
</head>
<body>

    <header>
        <h1>BRUM-BRUM</h1>
        <p>Showroom & Aksesoris Motor Kontemporer (SPA Vanilla JS)</p>
    </header>

    <div class="container">
        <div class="form-container">
            <h3 id="form-title">Tambah Motor / Produk</h3>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="product-title">Nama Produk / Motor</label>
                    <input type="text" id="product-title" placeholder="Contoh: Honda Vario 160 CC" required>
                </div>
                <div class="form-group">
                    <label for="product-price">Harga ($)</label>
                    <input type="number" id="product-price" placeholder="Contoh: 2500" required>
                </div>
                <button type="submit" id="btn-save" class="btn btn-submit">Simpan ke Katalog</button>
                <button type="button" id="btn-cancel" class="btn btn-cancel">Batal Edit</button>
            </form>
        </div>

        <div class="products-container">
            <div id="alert-box"></div>
            <h3>Katalog Produk Brum-Brum</h3>
            <div id="loading-indicator" class="loading">Memuat data dari server...</div>
            <div id="product-list" class="product-list"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://dummyjson.com/products";
        
        const productForm = document.getElementById('product-form');
        const productIdInput = document.getElementById('product-id');
        const productTitleInput = document.getElementById('product-title');
        const productPriceInput = document.getElementById('product-price');
        const formTitle = document.getElementById('form-title');
        const btnSave = document.getElementById('btn-save');
        const btnCancel = document.getElementById('btn-cancel');
        const productListContainer = document.getElementById('product-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const alertBox = document.getElementById('alert-box');

        let catalogData = [];

        function showAlert(message, type = 'success') {
            alertBox.textContent = message;
            alertBox.className = `alert-${type}`;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }

        async function fetchInitialProducts() {
            try {
                const response = await fetch(`${API_URL}?limit=6`);
                if (!response.ok) throw new Error("Gagal mengambil data dari server.");
                
                const data = await response.json();

                const motorNames = [
                    "Kawasaki Ninja ZX-25R", "Honda Vario 160 CBS", 
                    "Yamaha Aerox 155 Connected", "Vespa Sprint S 150", 
                    "Suzuki V-Strom 250SX", "Honda CRF250L"
                ];
                
                catalogData = data.products.map((item, index) => ({
                    id: item.id,
                    title: motorNames[index] || `Aksesoris Motor Custom ${item.id}`,
                    price: item.price * 10 
                }));

                renderDOM();
            } catch (error) {
                showAlert(`[Error GET]: ${error.message}`, 'error');
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        function renderDOM() {
            productListContainer.innerHTML = '';
            if (catalogData.length === 0) {
                productListContainer.innerHTML = '<p class="loading">Katalog kosong. Silahkan tambah data.</p>';
                return;
            }

            catalogData.forEach(product => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'product-item';
                itemDiv.setAttribute('data-id', product.id);
                itemDiv.innerHTML = `
                    <div class="product-info">
                        <h4>${product.title}</h4>
                        <p>$ ${product.price.toLocaleString()}</p>
                    </div>
                    <div class="action-btns">
                        <button class="btn-action btn-edit" onclick="prepareEdit(${product.id})">Edit</button>
                        <button class="btn-action btn-delete" onclick="deleteProduct(${product.id})">Hapus</button>
                    </div>
                `;
                productListContainer.appendChild(itemDiv);
            });
        }

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = productIdInput.value;
            const title = productTitleInput.value;
            const price = parseInt(productPriceInput.value);

            if (!title || !price) {
                showAlert("Harap isi semua kolom input!", "error");
                return;
            }

            if (id) {
                await updateProduct(id, title, price);
            } else {
                // Jalankan Aksi Mode TAMBAH (POST)
                await createProduct(title, price);
            }
            
            resetForm();
        });

        async function createProduct(title, price) {
            try {
                const response = await fetch(`${API_URL}/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, price })
                });

                if (!response.ok) throw new Error("Gagal mengirim data baru ke server.");
                const result = await response.json();

                catalogData.unshift({
                    id: result.id, // ID tiruan dari server (biasanya bernilai 195+)
                    title: result.title,
                    price: result.price
                });

                renderDOM();
                showAlert(`Sukses menambahkan motor baru: ${result.title}!`);
            } catch (error) {
                showAlert(`[Error POST]: ${error.message}`, 'error');
            }
        }

        async function updateProduct(id, title, price) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT', // atau 'PATCH'
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, price })
                });

                if (!response.ok) throw new Error(`Gagal memperbarui data dengan ID ${id} di server.`);
                const result = await response.json();

                const index = catalogData.findIndex(item => item.id == id);
                if (index !== -1) {
                    catalogData[index].title = result.title;
                    catalogData[index].price = result.price;
                }

                renderDOM();
                showAlert(`Sukses memperbarui katalog produk ID ${id}!`);
            } catch (error) {
                showAlert(`[Error PUT]: ${error.message}`, 'error');
            }
        }

        async function deleteProduct(id) {
            if (!confirm("Apakah Anda yakin ingin menghapus produk ini dari katalog Brum-Brum?")) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error(`Gagal menghapus data ID ${id} di server.`);
                const result = await response.json();

                if (result.isDeleted) {
                    catalogData = catalogData.filter(item => item.id !== id);
                    renderDOM();
                    showAlert(`Produk ID ${id} berhasil dihapus dari sistem dinamis.`);
                } else {
                    throw new Error("Server tidak mengonfirmasi penghapusan (isDeleted false).");
                }
            } catch (error) {
                showAlert(`[Error DELETE]: ${error.message}`, 'error');
            }
        }

        function prepareEdit(id) {
            const product = catalogData.find(item => item.id === id);
            if (product) {
                productIdInput.value = product.id;
                productTitleInput.value = product.title;
                productPriceInput.value = product.price;

                formTitle.textContent = "Mode Edit Motor / Produk";
                btnSave.textContent = "Perbarui Katalog";
                btnCancel.style.display = "block";
                productTitleInput.focus();
            }
        }

        function resetForm() {
            productIdInput.value = '';
            productForm.reset();
            formTitle.textContent = "Tambah Motor / Produk";
            btnSave.textContent = "Simpan ke Katalog";
            btnCancel.style.display = "none";
        }

        btnCancel.addEventListener('click', resetForm);

        document.addEventListener('DOMContentLoaded', fetchInitialProducts);
    </script>
</body>
</html>
